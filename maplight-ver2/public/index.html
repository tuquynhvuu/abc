<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <link rel="manifest" href="manifest.json" />
  <title>CCLab Project</title>
  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="lib/p5.js"></script>
  <script src="lib/mappa.js" type="text/javascript"></script>
  <script src="socket.io/socket.io.js"></script>  
</head>

<body>
  <!-- GPS Request Button -->
  <button id="requestOrientationButton" onclick="requestGPS()">Request GPS</button>

  <!-- TEAM JOIN FORM -->
  <div id="team-join-container">
    <h3>Join a Team</h3>
    <label for="playerName">Name:</label>
    <input type="text" id="playerName" placeholder="Enter name" />
    <br><br>
    <label for="teamSelect">Choose Team:</label>
    <select id="teamSelect">
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="yellow">Yellow</option>
    </select>
    <br><br>
    <button id="joinTeamButton">Join Team</button>
  </div>

  <!-- TEAM DISPLAY PANEL -->
  <div id="team-display">
    <span id="my-team-name"></span>
    <span id="team-members"></span>
  </div>

  <!-- P5 Canvas Container -->
  <div id="p5-canvas-container"></div>

  <!-- Scripts -->
  <script src="requestGPS.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
