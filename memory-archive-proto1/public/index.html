<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <link rel="manifest" href="manifest.json" />
  <title>The Clown’s Backpack - Canvas Space</title>
  <link rel="stylesheet" type="text/css" href="style.css">

  <!-- include socket.io -->
  <script src="socket.io/socket.io.js"></script>  
</head>
<body>

  <div class="main-wrapper">

    <div id="nameWrapper">
        <input type="text" id="nameInput" maxlength="16" placeholder="Your Name">
        <p>enter your name</p>
    </div>

    <canvas id="spaceCanvas"></canvas>

    <div id="formWrapper">
        <form id="chatForm">
            <input id="newMessage" placeholder="Write a memory…" autocomplete="off" />
            <button type="submit">send</button>
        </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
